name: CI

on:
  push:
    branches: [ main, master ]
    paths:
      - src/**
      - tests/**
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  compiler: gcc,         cxx: g++ }
          - { os: ubuntu-latest,  compiler: clang,       cxx: clang++ }
          - { os: windows-latest, compiler: msvc,        cxx: cl }
          - { os: macos-latest,   compiler: appleclang,  cxx: clang++ }

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCONSOLEUTIL_BUILD_TESTS=ON -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --config Release --verbose

      - name: Test (verbose)
        run: ctest --test-dir build -C Release -V

      - name: Verify tests were discovered
        shell: bash
        run: |
          count=$(ctest --test-dir build -C Release -N | grep -c "Test #")
          echo "Discovered $count test(s)"
          [ "$count" -gt 0 ] || { echo "::error::No tests discovered"; exit 1; }

      - name: Header is self-contained
        if: matrix.cxx != 'cl'
        run: |
          printf '%s\n' \
            '#include "cutils.hpp"' \
            'int main() { return 0; }' \
            > check.cpp
          ${{ matrix.cxx }} -std=c++17 -Isrc -fsyntax-only check.cpp
